<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Pedila: la sandalia alada de Hermes (πέδιλα). Dibujo original del proyecto. -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c6cff"/>
      <stop offset="1" stop-color="#2f80ff"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="1" stop-color="#e3a01c"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#fondo)"/>

  <!-- Ala: cinco plumas que nacen del tobillo y se abren hacia atrás y arriba -->
  <g fill="#ffffff">
    <path d="M118 120 C 92 122 62 116 40 98 C 64 100 90 104 116 108 Z" opacity="0.85"/>
    <path d="M118 112 C 90 106 64 92 48 70 C 72 80 96 90 120 98 Z" opacity="0.9"/>
    <path d="M120 104 C 96 90 78 70 70 46 C 90 64 108 78 126 90 Z" opacity="0.95"/>
    <path d="M124 96 C 108 76 100 54 102 32 C 114 54 126 70 138 82 Z"/>
    <path d="M132 90 C 126 70 128 50 136 34 C 140 56 146 70 152 80 Z" opacity="0.9"/>
  </g>

  <!-- Suela con forma de pie (talón a la izquierda, punta a la derecha) -->
  <path d="M86 190 C 82 178 92 170 108 170 C 140 170 170 166 196 164 C 214 163 228 168 230 177 C 232 186 222 192 206 193 L 112 198 C 98 199 89 196 86 190 Z" fill="url(#oro)"/>
  <path d="M100 189 C 140 188 180 185 220 181" fill="none" stroke="#b97b0c" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- Tira del talón hasta el tobillero -->
  <path d="M104 172 C 102 150 110 132 124 120" fill="none" stroke="url(#oro)" stroke-width="9" stroke-linecap="round"/>
  <!-- Tobillero -->
  <ellipse cx="140" cy="116" rx="22" ry="8" fill="none" stroke="url(#oro)" stroke-width="8"/>
  <!-- Tiras del empeine -->
  <path d="M160 120 C 168 136 176 150 186 166" fill="none" stroke="url(#oro)" stroke-width="9" stroke-linecap="round"/>
  <path d="M132 168 C 146 152 164 144 182 146" fill="none" stroke="url(#oro)" stroke-width="8" stroke-linecap="round"/>
  <path d="M156 167 C 168 160 182 158 200 160" fill="none" stroke="url(#oro)" stroke-width="7" stroke-linecap="round"/>
</svg>
